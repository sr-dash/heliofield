<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HelioField</title>
<meta name="description" content="The Sun's coronal magnetic field in 3D, updated daily: GONG magnetograms, PFSS field lines, source surface, heliospheric current sheet and the spacecraft fleet.">
<script>
  // Set before first paint so neither the embed layout nor a folded panel flashes.
  (() => {
    const q = new URLSearchParams(location.search), h = document.documentElement;
    const embed = q.get("embed") === "1";
    if (embed) h.classList.add("embed");
    if (q.get("controls") === "0") h.classList.add("no-controls");
    let folded = q.get("panel") === "0" || (embed && q.get("panel") !== "1");
    // Phones start with the scene, not the sheet; elsewhere the last choice wins.
    if (!embed && !q.has("panel")) {
      folded = matchMedia("(max-width: 760px)").matches;
      if (!folded) try { folded = localStorage.getItem("hf.panel") === "closed"; } catch (e) {}
    }
    if (folded) h.classList.add("panel-closed");
  })();
</script>
<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="view"></div>

<header class="bar">
  <div class="brand"><strong>HelioField</strong><span>coronal magnetic field in 3D</span></div>
  <div class="date">
    <button id="prev" title="Previous day (←)" aria-label="Previous day">‹</button>
    <select id="day" aria-label="Date"></select>
    <button id="next" title="Next day (→)" aria-label="Next day">›</button>
    <span id="src" class="src"></span>
  </div>
  <a class="guide-link" href="guide.html">Guide</a>
  <a class="embed-open" id="embedOpen" href="./" target="_blank" rel="noopener">HelioField ↗</a>
  <button id="panelToggle" class="panel-toggle" aria-controls="panel" aria-expanded="true" title="Show or hide the panel (L)">Layers</button>
</header>

<aside id="panel" aria-label="Layers and view">
  <div class="panel-head">
    <span>Layers &amp; view</span>
    <button id="panelClose" class="icon" aria-label="Hide panel" title="Hide panel (L)">×</button>
  </div>

  <details open>
    <summary>Sun <a class="help" href="guide.html#layers-sun" title="What these layers show">?</a></summary>
    <label><input type="checkbox" id="lyrPhoto" checked> <span>Photospheric B<sub>r</sub></span></label>
    <label><input type="checkbox" id="lyrClosed" checked> <span>Closed field lines</span></label>
    <label><input type="checkbox" id="lyrOpen" checked> <span>Open field lines</span></label>
    <label><input type="checkbox" id="lyrSS" checked> <span>Source surface B<sub>r</sub></span></label>
    <label class="slider sub"><span>Opacity</span><input type="range" id="ssAlpha" min="0" max="1" step="0.05" value="0.25"></label>
    <label><input type="checkbox" id="lyrPIL" checked> <span>Neutral line</span></label>
  </details>

  <details open>
    <summary>Heliosphere <a class="help" href="guide.html#layers-helio" title="What these layers show">?</a></summary>
    <label><input type="checkbox" id="lyrHCS" checked> <span>Current sheet</span></label>
    <label class="slider sub"><span>Out to <output id="rOut">1.2</output> au</span><input type="range" id="rmax" min="0.1" max="1.8" step="0.1" value="1.2"></label>
    <label><input type="checkbox" id="lyrFleet" checked> <span>Planets and spacecraft</span></label>
    <label><input type="checkbox" id="lyrSpiral" checked> <span>Connection to the Sun</span></label>
    <label class="slider"><span>Solar wind <output id="vOut">400</output> km/s</span><input type="range" id="vsw" min="300" max="800" step="100" value="400"></label>
    <div class="seg" role="group" aria-label="Distance scale">
      <button id="scaleLog" class="on" aria-pressed="true">Log distance</button><button id="scaleTrue" aria-pressed="false">True distance</button>
    </div>
  </details>

  <details open>
    <summary>View <a class="help" href="guide.html#navigate" title="How to move around">?</a></summary>
    <div class="seg">
      <button id="viewEarth" title="From Earth (E)">From Earth</button><button id="viewNorth" title="From north (N)">From north</button><button id="viewFleet" title="Whole fleet (F)">Whole fleet</button>
    </div>
    <label><input type="checkbox" id="spin"> <span>Rotate slowly</span></label>
  </details>

  <details>
    <summary>This map <a class="help" href="guide.html#data" title="Where the data come from">?</a></summary>
    <div id="info"></div>
  </details>

  <details>
    <summary>Footpoints <a class="help" href="guide.html#connectivity" title="How footpoints are found">?</a></summary>
    <div id="feet"></div>
  </details>

  <details>
    <summary>Share <a class="help" href="guide.html#embed" title="Links and embedding">?</a></summary>
    <p class="note">Opens on this date, with these layers, wind speed and view.</p>
    <div class="seg">
      <button id="copyLink">Copy link</button><button id="copyEmbed">Copy embed code</button>
    </div>
    <textarea id="shareOut" readonly rows="4" aria-label="Link or embed code" hidden></textarea>
  </details>

  <p class="panel-foot"><a href="guide.html">How to use</a> · <a href="guide.html#methods">Methods and data</a></p>
</aside>

<div id="legend">
  <span><i class="sw neg"></i><span>B<sub>r</sub> &lt; 0</span></span>
  <span><i class="sw pos"></i><span>B<sub>r</sub> &gt; 0</span></span>
  <span><i class="ln closed"></i><span>closed</span></span>
  <span><i class="ln op"></i><span>open +</span></span>
  <span><i class="ln on"></i><span>open −</span></span>
  <span><i class="ln hcs"></i><span>HCS</span></span>
</div>
<div id="status" role="status"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
