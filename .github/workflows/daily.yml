# Daily coronal-field product.
#
# Builds today's and yesterday's PFSS product from the last GONG mrzqs map of
# each day (yesterday is rebuilt in case its last maps arrived late), thins
# history to one day per Carrington rotation beyond 120 days, and commits.
# A run takes about a minute and under 1.5 GB of memory.
#
# GONG does not answer GitHub's runners, so the day's map is usually the HMI
# daily synoptic frame, taken at about 16:24 UTC and served only while it is
# JSOC's current frame. So the build is tried several times on the day itself
# (GitHub starts scheduled runs late, sometimes by hours), and each try ends
# at once when the product it is due to make already exists.

name: Daily field

on:
  schedule:
    - cron: "40 18 * * *"
    - cron: "40 20 * * *"
    - cron: "40 23 * * *"
    - cron: "40 2 * * *"
  workflow_dispatch:
    inputs:
      from:
        description: "Backfill from this date (YYYY-MM-DD); empty builds yesterday and today"
        type: string
        default: ""

permissions:
  contents: write
  pages: write

concurrency:
  group: daily-field
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # The product due now: today's once the day's map can exist (after
      # 17:00 UTC), else yesterday's. A scheduled run with it in hand stops.
      - name: Anything to do?
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$(date -u +%H)" -ge 17 ]; then due=$(date -u +%F); else due=$(date -u -d yesterday +%F); fi
          if [ -f "data/$due/meta.json" ]; then
            echo "The product for $due is already here."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "Building the product for $due."
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v7
        if: steps.check.outputs.go == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v7
        if: steps.check.outputs.go == 'true'
        with:
          node-version: "22"

      - run: pip install -r requirements.txt
        if: steps.check.outputs.go == 'true'

      - name: Build products
        if: steps.check.outputs.go == 'true'
        run: |
          today=$(date -u +%F)
          from="${{ inputs.from }}"
          [ -z "$from" ] && from=$(date -u -d yesterday +%F)
          python scripts/build_day.py --date "$from" --to "$today" --force --prune

      # New HMI rotation maps (one a month) and this year's fleet positions,
      # for dates computed in the browser.
      - name: Update the history archive
        if: steps.check.outputs.go == 'true'
        run: python scripts/build_history.py

      # Open-field footprints for the new products and any new rotation, and
      # the per-rotation series (only rotations not yet in the file are solved).
      - name: Footprints and series
        if: steps.check.outputs.go == 'true'
        run: |
          python scripts/build_open_field.py --recent 2
          python scripts/build_series.py

      # The space-weather time series: each new product's numbers, computed
      # with the page's own model, and the solar wind measured at L1 (OMNI,
      # SWPC real-time). A failed download is reported, never fatal.
      - name: Space-weather record
        if: steps.check.outputs.go == 'true'
        run: python scripts/sw_record.py

      - name: Commit and push
        if: steps.check.outputs.go == 'true'
        id: commit
        run: |
          git config user.name "Soumyaranjan Dash"
          git config user.email "sdash@nso.edu"
          git add -A data sw
          if git diff --cached --quiet; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Daily field product $(date -u +%F)"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Rebuild the site
        if: steps.check.outputs.go == 'true' && steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/pages/builds" --silent \
            || echo "::warning::Could not request a Pages build; it will publish on the next push."
